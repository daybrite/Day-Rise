<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- First Light: a half sun on the horizon under a fan of tapered rays. Teal sky against an
       amber motif — complementary, so the silhouette holds at 16 px. -->
  <defs>
    <linearGradient id="fl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08363f"/>
      <stop offset="0.62" stop-color="#1f6f6d"/>
      <stop offset="1" stop-color="#f0a95c"/>
    </linearGradient>
    <radialGradient id="fl-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fl-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c4"/>
      <stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
  </defs>
  <g id="day:background">
    <rect width="1024" height="1024" fill="url(#fl-sky)"/>
    <circle cx="512" cy="640" r="360" fill="url(#fl-glow)"/>
    <path d="M0 640 L1024 640 L1024 1024 L0 1024 Z" fill="#07262c"/>
    <rect x="0" y="632" width="1024" height="10" fill="#ffd98a" opacity="0.55"/>
  </g>
  <g id="day:foreground">
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#ffd166" transform="translate(512 640) rotate(-62)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#ffd166" transform="translate(512 640) rotate(-41)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#ffd166" transform="translate(512 640) rotate(-20)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#ffd166" transform="translate(512 640)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#ffd166" transform="translate(512 640) rotate(20)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#ffd166" transform="translate(512 640) rotate(41)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#ffd166" transform="translate(512 640) rotate(62)"/>
    <path d="M352 640 A 160 160 0 0 1 672 640 Z" fill="#ffb703"/>
  </g>
  <g id="day:monochrome" display="none">
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#000000" transform="translate(512 640) rotate(-62)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#000000" transform="translate(512 640) rotate(-41)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#000000" transform="translate(512 640) rotate(-20)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#000000" transform="translate(512 640)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#000000" transform="translate(512 640) rotate(20)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#000000" transform="translate(512 640) rotate(41)"/>
    <path d="M-20 -206 L0 -330 L20 -206 Z" fill="#000000" transform="translate(512 640) rotate(62)"/>
    <path d="M352 640 A 160 160 0 0 1 672 640 Z" fill="#000000"/>
  </g>
</svg>
