# The Day project manifest (https://daybrite.dev/docs/cli). `name`/`version` come from
# Cargo.toml; any [app] property may be overridden per platform, toolkit, or target.
schema = 1

[app]
id = "dev.daybrite.dayrise"
title = "Day Rise"
build = 1
targets = ["ios-uikit", "android-mdc", "macos-appkit", "macos-gtk", "macos-qt", "linux-gtk", "linux-qt", "windows-xaml", "windows-qt", "windows-gtk", "harmony-arkui", "web-dom"]

[window]
width = 960
height = 640
