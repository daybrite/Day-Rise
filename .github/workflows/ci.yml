name: ci

# Day-Rise is a REFERENCE COPY of `day new` output, so this workflow does two jobs at once:
# it proves the scaffold still builds and ships, and it proves the checkout has not drifted
# away from what `day new` produces today.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Four times a day (UTC). The scaffold is GENERATED by the day CLI, so it can go stale
    # without anyone touching this repo — a template change lands in daybrite/day and this
    # checkout is silently wrong until the next run says so.
    - cron: "0 1,7,13,19 * * *"

permissions:
  contents: write # release-asset upload on tag builds
  pages: write    # web-dom → GitHub Pages (deploy-web)
  id-token: write # deploy-pages OIDC token (deploy-web)

jobs:
  # ---------------------------------------------------------------------------
  # Is this checkout still exactly `day new` output?
  # ---------------------------------------------------------------------------
  scaffold-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          # The framework this reference is generated FROM. `latest` would compare the checkout
          # against a published CLI while the template lives on main, and report drift that is
          # really just a release lag.
          version: main

      - name: Scaffold a fresh app and diff it against this checkout
        run: |
          set -euo pipefail

          # The scaffold flags must match the ones the reference was generated with, or every run
          # reports drift that is really a different invocation. `targets` is read back out of
          # Day.toml so the two cannot disagree; the rest are literals, repeated in the failure
          # message below so the fix is copy-pasteable.
          TARGETS=$(python3 - <<'PY'
          import re, pathlib
          toml = pathlib.Path("Day.toml").read_text()
          m = re.search(r'^targets\s*=\s*\[(.*?)\]', toml, re.S | re.M)
          print(",".join(re.findall(r'"([^"]+)"', m.group(1))))
          PY
          )
          echo "targets from Day.toml: $TARGETS"

          FRESH=$(mktemp -d)
          # --appid is what gives website/site.toml this repo's real Pages host; without it the
          # scaffold writes the `example.github.io` placeholder and every run reports that as drift.
          ( cd "$FRESH" && "$DAY_BIN" new app Day-Rise --title "Day Rise" --no-input \
              --appid dev.daybrite.dayrise --toolkit "$TARGETS" )

          # Compare only what this repo actually carries as SOURCE. Everything a build leaves
          # behind — target/, build/, Cargo.lock, the Xcode workspace, Gradle's caches — is
          # already gitignored by the scaffold itself, so deriving the list from git means this
          # check follows the scaffold's own .gitignore instead of duplicating it here.
          #
          # `--cached --others --exclude-standard` is tracked files PLUS untracked ones that are
          # not ignored. Plain `git ls-files` lists only the index, which on a freshly scaffolded
          # repo with no commits is nearly empty — and an empty list makes this whole check pass
          # without comparing anything.
          git ls-files --cached --others --exclude-standard > /tmp/files.txt
          COUNT=$(wc -l < /tmp/files.txt | tr -d ' ')
          if [ "$COUNT" -lt 20 ]; then
            echo "Refusing to run: only $COUNT files to compare, which cannot be a Day scaffold"
            echo "(a real one is ~80). The checkout is incomplete, so a PASS would mean nothing."
            exit 1
          fi
          echo "comparing $COUNT files"

          # `.github/` is the one deliberate exception: `day new` does not scaffold a workflow,
          # so this very file would otherwise report itself as drift forever.
          FAILED=0
          : > /tmp/drift.txt
          while IFS= read -r f; do
            case "$f" in .github/*) continue ;; esac
            if [ ! -e "$FRESH/Day-Rise/$f" ]; then
              echo "  + $f  (in this repo, NOT produced by \`day new\`)" >> /tmp/drift.txt
              FAILED=1
            elif ! cmp -s "$f" "$FRESH/Day-Rise/$f"; then
              echo "  ~ $f  (contents differ from \`day new\`)" >> /tmp/drift.txt
              FAILED=1
            fi
          done < /tmp/files.txt

          # And the other direction: something `day new` emits that this checkout has dropped.
          while IFS= read -r f; do
            rel=${f#"$FRESH/Day-Rise/"}
            case "$rel" in .git/*|.github/*) continue ;; esac
            if [ ! -e "$rel" ]; then
              echo "  - $rel  (produced by \`day new\`, MISSING here)" >> /tmp/drift.txt
              FAILED=1
            fi
          done < <(find "$FRESH/Day-Rise" -type f -not -path "*/.git/*")

          if [ "$FAILED" -eq 0 ]; then
            echo "No drift: this checkout is exactly what \`day new\` produces."
            exit 0
          fi

          {
            echo "## Scaffold drift"
            echo
            echo "Day-Rise is a reference copy of \`day new\` output and no longer matches it:"
            echo
            echo '```'
            cat /tmp/drift.txt
            echo '```'
            echo
            echo "\`+\` only here · \`~\` contents differ · \`-\` only in a fresh scaffold"
            echo
            echo "### Fixing it"
            echo
            echo "Do **not** edit Day-Rise. It is generated, and a hand edit is lost on the next"
            echo "regeneration. Change the template instead — \`day/crates/day-cli/templates/app/\`"
            echo "— then regenerate:"
            echo
            echo '```sh'
            echo "cd day && cargo install --path crates/day-cli --force   # the template is EMBEDDED"
            echo "cd .. && rm -rf Day-Rise                                 # in the CLI at compile time"
            echo "day new app Day-Rise --title \"Day Rise\" --no-input --toolkit \"$TARGETS\""
            echo "cd Day-Rise && day patch --local ../day                  # machine-local, gitignored"
            echo '```'
            echo
            echo "Then restore \`.github/\`, which \`day new\` does not scaffold."
            echo
            echo "Two things commonly show up here that are not template changes at all: a CLI"
            echo "older than the one that generated this checkout (compare \`day --version\`), and a"
            echo "tree that was scaffolded once and edited since. Regenerating from scratch, as"
            echo "above, settles both."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # ---------------------------------------------------------------------------
  # Build, run the dayscripts, and publish the project site.
  # ---------------------------------------------------------------------------
  app:
    # Gated on the drift check: building a scaffold that is not THE scaffold proves nothing
    # about `day new`, which is the only thing this repo exists to demonstrate.
    needs: scaffold-drift
    uses: daybrite/actions/.github/workflows/build-day-app.yml@main
    secrets: inherit
    with:
      targets: macos-appkit, ios-uikit, android-mdc, linux-gtk, linux-qt, windows-xaml, harmony-arkui, web-dom
      # Same framework the drift job scaffolds from, so the CLI and the template agree.
      day-version: main
      # `auto` picks up dayscript/demo.yaml — the walkthrough that drives every feature the
      # app ships, and whose screenshots become the project site's gallery.
      scripts: auto
      preflight-checks: fmt, clippy, test
      # Build against day's main, not the revision Cargo.lock happens to pin. The lock is
      # committed because the checks above pass `--locked` and it will not create one — but this
      # repository exists to prove the CURRENT framework still builds what `day new` emits, and a
      # lock frozen at whatever revision it was last generated against would quietly stop doing
      # that. Same reasoning as `day-version: main` above, applied to the app's own dependency.
      update-day-deps: true
      # website/site.toml turns this into a full daysite project site, with the web-dom build
      # hosted under webapp/.
      deploy-web: true
      daysite-version: main
