name: ci

# Day-Rise is a REFERENCE COPY of `day new` output, so this workflow does two jobs at once:
# it proves the scaffold still builds and ships, and it proves the checkout has not drifted
# away from what `day new` produces today.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Four times a day (UTC). The scaffold is GENERATED by the day CLI, so it can go stale
    # without anyone touching this repo — a template change lands in daybrite/day and this
    # checkout is silently wrong until the next run says so.
    - cron: "0 1,7,13,19 * * *"

permissions:
  contents: write # release-asset upload on tag builds
  pages: write    # web-dom → GitHub Pages (deploy-web)
  id-token: write # deploy-pages OIDC token (deploy-web)

jobs:
  # ---------------------------------------------------------------------------
  # Is this checkout still exactly `day new` output?
  # ---------------------------------------------------------------------------
  scaffold-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          # The framework this reference is generated FROM. `latest` would compare the checkout
          # against a published CLI while the template lives on main, and report drift that is
          # really just a release lag.
          version: main

      - name: Scaffold a fresh app and diff it against this checkout
        # The check itself lives in scripts/scaffold-drift.sh so it can be run by hand on macOS or
        # Linux — and, with `--local ../day`, against an unpublished template edit. What runs here
        # and what a developer runs there are then the same code, instead of a workflow-shaped copy
        # of it that drifts. `$DAY_BIN` comes from the setup-day-cli action above; the script falls
        # back to `day` on PATH without it.
        run: scripts/scaffold-drift.sh

  # ---------------------------------------------------------------------------
  # Build, run the dayscripts, and publish the project site.
  # ---------------------------------------------------------------------------
  app:
    uses: daybrite/actions/.github/workflows/build-day-app.yml@main
    secrets: inherit
    with:
      targets: macos-appkit, ios-uikit, android-mdc, linux-gtk, linux-qt, windows-xaml, harmony-arkui, web-dom
      # Same framework the drift job scaffolds from, so the CLI and the template agree.
      day-version: main
      # `auto` picks up dayscript/demo.yaml — the walkthrough that drives every feature the
      # app ships, and whose screenshots become the project site's gallery.
      scripts: auto
      # Two iOS form factors, each its own job, its own screenshot artifact, and its own column
      # in the published gallery. The scaffold's navigation is adaptive, so a phone and a tablet
      # are genuinely different screens rather than the same one at two sizes — which is exactly
      # what the gallery should show a visitor.
      #
      # `device` is a name PREFIX and `os` a major version: runner images retire exact device
      # names and runtimes, and a pinned one starts failing the day the image moves.
      ios-devices: |
        device=iPhone,           os=iOS 26, orientation=portrait
        device=iPad Pro 13-inch, os=iOS 26, orientation=landscape, slug=ipad
      preflight-checks: fmt, clippy, test
      # Build against day's main, not the revision Cargo.lock happens to pin. The lock is
      # NOT committed here, unlike an ordinary app: this one pins nothing. The preflight resolves
      # the lock itself and then moves the day crates to the tip of main, so a committed lock would
      # be overwritten before it was ever read — while still being something a local `day patch
      # --local` build silently rewrites into machine-local paths and something a human can commit
      # by accident. This repository exists to prove the CURRENT framework still builds what
      # `day new` emits, so tracking main IS the pin. Same reasoning as `day-version: main` above,
      # applied to the app's own dependency.
      update-day-deps: true
      # website/site.toml turns this into a full daysite project site, with the web-dom build
      # hosted under webapp/.
      deploy-web: true
      daysite-version: main
